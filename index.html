<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamawatLab — Jelajah Astronomi & Ilmu Falak</title>
<meta name="description" content="SamawatLab: ensiklopedia ringkas astronomi, cabang-cabangnya, dan ilmu falak (astronomi Islam) — lengkap dengan tokoh, rumus, kegunaan, kasus, dan referensi.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --bg0:#07041a; --bg1:#0d0830; --violet:#5b2fa8; --violet2:#8a5cf0;
  --blue:#2f5fe0; --blue2:#6fa0ff; --red:#d8365a; --red2:#ff6b83;
  --sage:#c9e3a2; --ink:#ece8ff; --mute:#a9a3cf; --line:rgba(160,150,255,.16);
  --card:rgba(20,13,58,.62); --card2:rgba(30,20,80,.55);
  --radius:18px; --shadow:0 10px 40px rgba(5,2,25,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
.logo-stage{margin:0 auto;padding:6%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg0); line-height:1.7; min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 70% 55% at 15% 8%, rgba(91,47,168,.55), transparent 60%),
    radial-gradient(ellipse 60% 50% at 88% 22%, rgba(47,95,224,.42), transparent 62%),
    radial-gradient(ellipse 55% 45% at 70% 92%, rgba(216,54,90,.30), transparent 65%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 70%);
  background-attachment:fixed;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.orn{position:fixed;z-index:0;pointer-events:none;opacity:.07;color:var(--sage)}
.orn.moon{width:min(78vw,760px);right:-14vw;top:8vh}
.orn.orbit{width:min(90vw,900px);left:-30vw;bottom:-18vh;opacity:.06;color:var(--blue2)}
a{color:var(--blue2);text-decoration:none} a:hover{color:var(--red2)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 22px}

/* NAV */
header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(8,4,28,.72);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:700;letter-spacing:.14em;font-size:.95rem}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(201,227,162,.35),0 0 24px rgba(138,92,240,.5)}
.brand small{display:block;font-weight:400;letter-spacing:.2em;color:var(--sage);font-size:.62rem;opacity:.85}
nav.menu{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{color:var(--mute);padding:8px 14px;border-radius:999px;font-size:.9rem;transition:.2s}
nav.menu a:hover,nav.menu a.on{color:#fff;background:linear-gradient(135deg,rgba(138,92,240,.45),rgba(47,95,224,.35));box-shadow:inset 0 0 0 1px var(--line)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:1.2rem;cursor:pointer}
@media(max-width:860px){
  .burger{display:block}
  nav.menu{display:none;position:absolute;left:0;right:0;top:68px;background:rgba(8,4,28,.96);padding:12px 18px 18px;flex-direction:column;border-bottom:1px solid var(--line)}
  nav.menu.open{display:flex}
}

/* HERO */
.hero{padding:70px 0 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.12;font-weight:800}
.grad{background:linear-gradient(100deg,var(--blue2),var(--violet2) 45%,var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--mute);font-size:1.1rem;margin:18px 0 26px;max-width:56ch}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;border:1px solid var(--line);color:var(--ink);background:var(--card);transition:.25s;cursor:pointer;font-size:.95rem}
.btn:hover{transform:translateY(-2px);color:#fff;border-color:var(--violet2)}
.btn.pri{background:linear-gradient(135deg,var(--violet),var(--blue));border:none;box-shadow:0 8px 28px rgba(91,47,168,.5)}
.btn.red{background:linear-gradient(135deg,var(--red),var(--violet));border:none}
.logo-stage{position:relative;display:grid;place-items:center}
.logo-stage img{width:min(100%,400px);border-radius:50%;position:relative;z-index:2;filter:drop-shadow(0 0 40px rgba(138,92,240,.55))}
.logo-stage::before,.logo-stage::after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(201,227,162,.25)}
.logo-stage::before{inset:-5%;animation:spin 60s linear infinite}
.logo-stage::after{inset:-16%;border-color:rgba(111,160,255,.2);animation:spin 90s linear infinite reverse}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red2);box-shadow:0 0 14px var(--red2);top:-4%;left:50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px}.logo-stage{order:-1;max-width:300px;margin:0 auto}}

/* SECTIONS & CARDS */
h2.sec{font-size:1.6rem;margin:46px 0 6px}
p.sub{color:var(--mute);margin-bottom:22px;max-width:70ch}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px);transition:.28s;position:relative;overflow:hidden;display:block;color:var(--ink)}
a.card:hover{transform:translateY(-5px);border-color:rgba(138,92,240,.6);color:var(--ink)}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(138,92,240,.25),transparent 70%)}
.card .ic{font-size:1.9rem;margin-bottom:8px;display:block}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--mute);font-size:.92rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(216,54,90,.18);color:var(--red2);border:1px solid rgba(216,54,90,.35);margin-bottom:10px}
.tag.b{background:rgba(47,95,224,.18);color:var(--blue2);border-color:rgba(47,95,224,.4)}
.tag.v{background:rgba(138,92,240,.18);color:var(--violet2);border-color:rgba(138,92,240,.4)}
.falak-banner{margin-top:34px;border-radius:24px;padding:34px;border:1px solid rgba(201,227,162,.25);background:linear-gradient(120deg,rgba(91,47,168,.5),rgba(47,95,224,.3) 55%,rgba(216,54,90,.3));display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
@media(max-width:700px){.falak-banner{grid-template-columns:1fr}}

/* ARTICLE LAYOUT */
.layout{display:grid;grid-template-columns:250px 1fr;gap:34px;padding:38px 0 60px;align-items:start}
aside.toc{position:sticky;top:90px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;max-height:calc(100vh - 120px);overflow:auto}
aside.toc h4{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:10px}
aside.toc a{display:block;color:var(--mute);padding:6px 10px;border-radius:10px;font-size:.88rem;border-left:2px solid transparent}
aside.toc a:hover,aside.toc a.on{color:#fff;background:rgba(138,92,240,.18);border-left-color:var(--red2)}
aside.toc hr{border:none;border-top:1px solid var(--line);margin:12px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside.toc{position:static;max-height:none}}
article{min-width:0}
article h1{font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.2;margin-bottom:10px}
article .lede{color:var(--mute);font-size:1.08rem;margin-bottom:26px;max-width:70ch}
article section{margin-bottom:34px;scroll-margin-top:90px}
article h2{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
article h2::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:linear-gradient(135deg,var(--red2),var(--violet2));border-radius:2px;flex:none}
article p{margin-bottom:12px;max-width:75ch}
article ul{margin:0 0 12px 22px;max-width:75ch} article li{margin-bottom:6px}
.crumb{font-size:.85rem;color:var(--mute);margin-bottom:12px}
.formula{background:linear-gradient(135deg,rgba(47,95,224,.16),rgba(91,47,168,.2));border:1px solid var(--line);border-left:3px solid var(--blue2);border-radius:14px;padding:14px 18px;margin:12px 0}
.formula b{display:block;font-size:.85rem;color:var(--sage);margin-bottom:4px;letter-spacing:.03em}
.formula code{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:1.12rem;display:block;color:#fff;overflow-x:auto;padding:2px 0}
.formula small{display:block;color:var(--mute);margin-top:4px;font-size:.84rem}
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.person{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.person b{display:block;color:#fff} .person span{color:var(--mute);font-size:.88rem}
.case{background:linear-gradient(135deg,rgba(216,54,90,.14),rgba(91,47,168,.15));border:1px solid rgba(216,54,90,.3);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.case b{color:var(--red2);display:block;margin-bottom:2px}
.note{background:rgba(201,227,162,.08);border:1px solid rgba(201,227,162,.3);border-radius:14px;padding:12px 16px;font-size:.92rem;color:#e5f2cf;margin:12px 0}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:22px}
.timeline .t{position:relative;margin-bottom:16px}
.timeline .t::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--violet2);box-shadow:0 0 12px var(--violet2)}
.timeline .t b{color:var(--sage)}
table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:.92rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sage);font-weight:600;background:rgba(91,47,168,.2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.refs{list-style:none;margin:0!important}
.refs li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem;word-break:break-word}
.refs li span{color:var(--mute)}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:30px;flex-wrap:wrap}

/* TOOL */
.tool{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media(max-width:860px){.tool{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
label{display:block;font-size:.82rem;color:var(--sage);margin:10px 0 4px;letter-spacing:.04em}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(8,4,30,.7);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--violet2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out td:last-child{font-variant-numeric:tabular-nums;font-weight:600;color:#fff;text-align:right}
.compass{width:210px;height:210px;margin:6px auto 0;position:relative;border-radius:50%;border:2px solid rgba(201,227,162,.4);background:radial-gradient(circle,rgba(91,47,168,.35),rgba(8,4,30,.8))}
.compass span{position:absolute;font-size:.8rem;color:var(--mute)}
.compass .n{top:4px;left:50%;transform:translateX(-50%);color:var(--red2);font-weight:700}
.compass .e{right:8px;top:50%;transform:translateY(-50%)} .compass .s{bottom:4px;left:50%;transform:translateX(-50%)} .compass .w{left:8px;top:50%;transform:translateY(-50%)}
.needle{position:absolute;left:50%;top:50%;width:4px;height:88px;margin-left:-2px;margin-top:-88px;transform-origin:50% 88px;background:linear-gradient(var(--red2),transparent);border-radius:4px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.needle::after{content:"🕋";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.1rem}
footer{position:relative;z-index:1;border-top:1px solid var(--line);margin-top:30px;padding:30px 0 50px;color:var(--mute);font-size:.88rem;text-align:center;background:rgba(5,2,20,.5)}
footer img{width:54px;border-radius:50%;margin-bottom:8px}
.search{max-width:460px;margin:0 0 22px;position:relative}
.search input{padding-left:40px;border-radius:999px}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:1.25rem;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* =========================================================
   1. LATAR BINTANG
   ========================================================= */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,S=[];
  function init(){W=c.width=innerWidth;H=c.height=innerHeight;S=[];const n=Math.min(220,Math.floor(W*H/9000));
    for(let i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:Math.random()*.02+.004,
      h:[210,265,345,50][Math.floor(Math.random()*4)]});}
  function draw(t){x.clearRect(0,0,W,H);
    for(const s of S){const a=.35+.65*Math.abs(Math.sin(s.p+t*s.s*.06));x.fillStyle=`hsla(${s.h},80%,${s.h==50?85:78}%,${a})`;
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    requestAnimationFrame(draw);}
  addEventListener('resize',init);init();requestAnimationFrame(draw);
})();

/* =========================================================
   2. UTILITAS TEMPLAT
   ========================================================= */
const F=(n,e,k)=>`<div class="formula"><b>${n}</b><code>${e}</code>${k?`<small>${k}</small>`:''}</div>`;
const UL=a=>`<ul>${a.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const CASES=a=>a.map(c=>`<div class="case"><b>${c[0]}</b>${c[1]}</div>`).join('');
const PEOPLE=a=>`<div class="people">${a.map(p=>`<div class="person"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
const TL=a=>`<div class="timeline">${a.map(t=>`<div class="t"><b>${t[0]}</b> — ${t[1]}</div>`).join('')}</div>`;
const NOTE=t=>`<div class="note">${t}</div>`;
const REFS=a=>`<ul class="refs">${a.map(r=>`<li>${r[0]}${r[1]?` — <a href="${r[1]}" target="_blank" rel="noopener">${r[1].replace(/^https?:\/\//,'')}</a>`:''}${r[2]?` <span>(${r[2]})</span>`:''}</li>`).join('')}</ul>`;
const TBL=(h,rows)=>`<div class="tblwrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* Referensi bersama */
const HP='http://hyperphysics.phy-astr.gsu.edu/hbase/';
const R={
 hp:['HyperPhysics — Beranda (R. Nave, Georgia State Univ.)',HP+'hframe.html'],
 hpIdx:['HyperPhysics — Indeks',  'https://hyperphysics.gsu.edu/hbase/indx.html'],
 hpKep:['HyperPhysics — Kepler\'s Laws',HP+'kepler.html'],
 hpStar:['HyperPhysics — Star Processes','https://hyperphysics.gsu.edu/hbase/starlog/starpro.html'],
 hpStarC:['HyperPhysics — Star Concepts','https://hyperphysics.gsu.edu/hbase/Starlog/starcon.html'],
 hpSun:['HyperPhysics — The Sun and Stars (NSCI 3001, Ch. 18)','https://hyperphysics.gsu.edu/hbase/Class/ncsi18.html'],
 nasa:['NASA Science','https://science.nasa.gov/'],
 nasaEcl:['NASA Eclipse Web Site (F. Espenak)','https://eclipse.gsfc.nasa.gov/'],
 iau:['International Astronomical Union','https://www.iau.org/'],
 esaGaia:['ESA — Gaia mission','https://www.esa.int/Science_Exploration/Space_Science/Gaia'],
 meeus:['Jean Meeus — <i>Astronomical Algorithms</i> (Willmann-Bell, 2nd ed., 1998)',null,'buku'],
 kemenag:['Kementerian Agama RI — Bimas Islam (Hisab &amp; Rukyat)','https://bimasislam.kemenag.go.id/'],
 khazin:['Muhyiddin Khazin — <i>Ilmu Falak dalam Teori dan Praktik</i> (Buana Pustaka)',null,'buku'],
 almanac:['Hisab Rukyat — <i>Ephemeris Hisab Rukyat</i> (terbitan tahunan Kemenag RI)',null,'buku'],
 wikiFalak:['Wikipedia ID — Ilmu falak','https://id.wikipedia.org/wiki/Ilmu_falak'],
 wikiAstro:['Wikipedia ID — Astronomi','https://id.wikipedia.org/wiki/Astronomi'],
 carroll:['Carroll &amp; Ostlie — <i>An Introduction to Modern Astrophysics</i>',null,'buku'],
 kutner:['M. Kutner — <i>Astronomy: A Physical Perspective</i> (Cambridge UP)',null,'buku'],
 saliba:['G. Saliba — <i>A History of Arabic Astronomy</i> (NYU Press, 1994)',null,'buku'],
};

/* =========================================================
   3. DATA: CABANG ASTRONOMI
   ========================================================= */
const CABANG=[
{id:'astrometri',ikon:'🧭',nama:'Astrometri & Astronomi Bola',ringkas:'Mengukur posisi, gerak, dan jarak benda langit; dasar semua sistem koordinat.',
 definisi:'Astrometri adalah cabang tertua astronomi: pengukuran presisi posisi, gerak diri (proper motion), dan paralaks bintang. Astronomi bola (spherical astronomy) menyediakan geometri bola langit dan sistem koordinatnya — fondasi bagi navigasi, kalender, dan ilmu falak.',

 ['Deklinasi — penjelasan mendalam',`<p><b>Definisi.</b> Deklinasi (<i>δ</i>) adalah sudut antara arah benda langit dan bidang ekuator langit. Bagi Matahari, δ berubah sepanjang tahun antara <b>−23°26′</b> (sekitar 22 Desember) dan <b>+23°26′</b> (sekitar 21 Juni), dan bernilai 0° pada ekuinoks (± 20–21 Maret &amp; 22–23 September).</p>
 ${F('Rumus deklinasi Matahari','sin δ = sin ε · sin λ<sub>☉</sub>','ε ≈ 23,44°; λ☉ = bujur ekliptika Matahari (0° di ekuinoks Maret, 90° di solstis Juni)')}
 ${F('Pendekatan sederhana (akurasi ±0,5°)','δ ≈ −23,44° · cos[ (360°/365) · (N + 10) ]','N = nomor hari dalam tahun (1 Januari = 1)')}

 <p><b>Penerapan.</b> δ menentukan panjang siang–malam, sudut jam terbenam/terbit, waktu Ashar, bahkan arah Matahari saat <i>rashdul kiblat</i>.</p>`],

function homeCards(q){
  q=(q||'').toLowerCase();
  const all=[...CABANG.map(c=>({h:'#/cabang/'+c.id,i:c.ikon,t:c.nama,p:c.ringkas,tag:'Astronomi'})),...FALAK.map(c=>({h:'#/falak/'+c.id,i:c.ikon,t:c.nama,p:c.ringkas,tag:'Falak'}))];

/* =========================================================
   6. KALKULATOR FALAK (edukatif)
   ========================================================= */
const KOTA={Semarang:[-6.9666,110.4203,7],Jakarta:[-6.2088,106.8456,7],Bandung:[-6.9175,107.6191,7],Yogyakarta:[-7.7956,110.3695,7],Surabaya:[-7.2575,112.7521,7],Medan:[3.5952,98.6722,7],Makassar:[-5.1477,119.4327,8],Denpasar:[-8.6705,115.2126,8],Jayapura:[-2.5337,140.7181,9],Mekah:[21.4225,39.8262,3]};
const RAD=Math.PI/180,DEG=180/Math.PI,mod=(a,n)=>((a%n)+n)%n;
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const n=jd-2451545.0,L=mod(280.460+0.9856474*n,360),g=mod(357.528+0.9856003*n,360)*RAD,
  lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD,eps=(23.439-0.0000004*n)*RAD,
  dec=Math.asin(Math.sin(eps)*Math.sin(lam)),ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*DEG;
  let eot=L-mod(ra,360);if(eot>180)eot-=360;if(eot<-180)eot+=360;return{dec:dec*DEG,eot:eot*4}}
function prayer(y,m,d,lat,lon,tz,o){o=o||{};const fa=o.fajr??-20,is=o.isha??-18,k=o.asr??1,ih=o.ih??2,s=sunPos(julian(y,m,d+.5-tz/24)),T=12+tz-lon/15-s.eot/60;
  const H=h=>Math.acos((Math.sin(h*RAD)-Math.sin(lat*RAD)*Math.sin(s.dec*RAD))/(Math.cos(lat*RAD)*Math.cos(s.dec*RAD)))*DEG/15;
  const aa=Math.atan(1/(k+Math.tan(Math.abs(lat-s.dec)*RAD)))*DEG;
  return{dec:s.dec,eot:s.eot,transit:T,subuh:T-H(fa),terbit:T-H(-.833),dzuhur:T+ih/60,ashar:T+H(aa),maghrib:T+H(-.833),isya:T+H(is)}}
function qibla(lat,lon){const kl=21.4225*RAD,kg=39.8262,dl=(kg-lon)*RAD,p=lat*RAD;
  const az=mod(Math.atan2(Math.sin(dl),Math.cos(p)*Math.tan(kl)-Math.sin(p)*Math.cos(dl))*DEG,360);
  const cd=Math.sin(p)*Math.sin(kl)+Math.cos(p)*Math.cos(kl)*Math.cos(dl);return{az,km:Math.acos(Math.min(1,Math.max(-1,cd)))*6371}}
const fmt=h=>{if(!isFinite(h))return '—';h=mod(h,24);let hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm==60){hh=(hh+1)%24;mm=0}return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const dm=x=>{const s=x<0?'−':'+',a=Math.abs(x),d=Math.floor(a),m=(a-d)*60;return s+d+'° '+m.toFixed(1)+'′'};

function pageAlat(){
  const t=new Date(),iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  return `<section style="padding:42px 0 60px"><span class="tag b">Interaktif</span><h1 style="font-size:2.3rem">🧮 Kalkulator Falak</h1>
  <p class="sub">Perhitungan edukatif dengan algoritma matahari ringkas (akurasi ±1 menit untuk jadwal; ±0,1° untuk deklinasi). Bukan pengganti jadwal resmi Kemenag / ephemeris untuk ibadah.</p>
  <div class="tool">
    <div class="panel">
      <label>Kota</label><select id="kota">${Object.keys(KOTA).map(k=>`<option>${k}</option>`).join('')}<option value="_c">Koordinat kustom…</option></select>
      <div class="row2"><div><label>Lintang φ (° , − = Selatan)</label><input id="lat" type="number" step="0.0001"></div><div><label>Bujur λ (° BT)</label><input id="lon" type="number" step="0.0001"></div></div>
      <div class="row2"><div><label>Zona waktu (UTC±)</label><input id="tz" type="number" step="0.5"></div><div><label>Tanggal</label><input id="tgl" type="date" value="${iso}"></div></div>
      <div class="row2"><div><label>Sudut Subuh (°)</label><input id="fa" type="number" value="-20" step="0.5"></div><div><label>Sudut Isya (°)</label><input id="is" type="number" value="-18" step="0.5"></div></div>
      <div class="row2"><div><label>Mazhab Ashar</label><select id="asr"><option value="1">Jumhur (bayangan = benda)</option><option value="2">Hanafi (2× benda)</option></select></div><div><label>Ihtiyat (menit)</label><input id="ih" type="number" value="2" step="1"></div></div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:6px">Posisi Matahari</h3>
      <table class="out"><tbody id="o1"></tbody></table>
      <h3 style="margin:16px 0 6px">Jadwal shalat (perkiraan)</h3>
      <table class="out"><tbody id="o2"></tbody></table>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:6px">Arah kiblat</h3>
      <table class="out"><tbody id="o3"></tbody></table>
      <div class="compass"><span class="n">U</span><span class="e">T</span><span class="s">S</span><span class="w">B</span><div class="needle" id="needle"></div></div>
    </div>
    <div class="panel">
      <h3>Cara membaca</h3>
      ${UL(['<b>Deklinasi</b> — sudut Matahari dari ekuator langit; menentukan panjang siang.','<b>Perata waktu</b> — selisih waktu Matahari sejati vs rata-rata.','<b>Azimut kiblat</b> — dihitung dari <u>Utara sejati</u> searah jarum jam; koreksi deklinasi magnet bila memakai kompas.','Rashdul kiblat tahun ini: <b>27/28 Mei</b> &amp; <b>15/16 Juli</b>, pukul ±16:18 / ±16:27 WIB.'])}
      ${NOTE('Metode: bujur ekliptika Matahari (Astronomical Almanac, ringkas) → δ, e → sudut jam untuk tiap tinggi Matahari.')}
    </div>
  </div></section>`;
}
function bindAlat(){
  const $=i=>document.getElementById(i);
  function pick(){const k=$('kota').value;if(k!=='_c'){const [a,b,z]=KOTA[k];$('lat').value=a;$('lon').value=b;$('tz').value=z}calc()}
  function calc(){
    const lat=+$('lat').value,lon=+$('lon').value,tz=+$('tz').value,[y,m,d]=$('tgl').value.split('-').map(Number);
    if(!y)return;const r=prayer(y,m,d,lat,lon,tz,{fajr:+$('fa').value,isha:+$('is').value,asr:+$('asr').value,ih:+$('ih').value});
    $('o1').innerHTML=`<tr><td>Deklinasi δ</td><td>${dm(r.dec)}</td></tr><tr><td>Perata waktu e</td><td>${r.eot>=0?'+':'−'}${Math.abs(r.eot).toFixed(1)} menit</td></tr><tr><td>Transit (Dzuhur tanpa ihtiyat)</td><td>${fmt(r.transit)}</td></tr>`;
    $('o2').innerHTML=[['Subuh',r.subuh],['Terbit',r.terbit],['Dzuhur',r.dzuhur],['Ashar',r.ashar],['Maghrib',r.maghrib],['Isya',r.isya]].map(a=>`<tr><td>${a[0]}</td><td>${fmt(a[1])}</td></tr>`).join('');
    const q=qibla(lat,lon);
    $('o3').innerHTML=`<tr><td>Azimut kiblat (dari Utara)</td><td>${q.az.toFixed(2)}°</td></tr><tr><td>Dari Barat ke Utara</td><td>${Math.abs(270-q.az).toFixed(2)}° ${q.az>270?'(ke Utara)':'(ke Selatan)'}</td></tr><tr><td>Jarak ke Ka'bah (lingkaran besar)</td><td>${Math.round(q.km).toLocaleString('id-ID')} km</td></tr>`;
    $('needle').style.transform=`rotate(${q.az}deg)`;
  }
  $('kota').addEventListener('change',pick);
  ['lat','lon','tz','tgl','fa','is','asr','ih'].forEach(i=>$(i).addEventListener('input',()=>{if(['lat','lon','tz'].includes(i))$('kota').value='_c';calc()}));
  pick();
}

function render(){
  const h=location.hash.replace(/^#\/?/,'');const [a,b]=h.split('/');
  let html,route=a||'home';
  if(!a)html=pageHome();
  else if(a==='atlas')html=atlasRoute(h.split('/').slice(1));
  else if(a==='belajar')html=belajarRoute(h.split('/').slice(1));
  else if(a==='astronomi')html=pageAstronomi();
  else if(a==='cabang')html=b?pageCabang(b):pageCabangList();
  else if(a==='falak')html=b?pageFalak(b):pageFalakList();
  else if(a==='alat')html=pageAlat();
  else if(a==='referensi')html=pageReferensi();
  else {html=pageHome();route='home'}
  app.innerHTML=html;setActive(route);scrollTo({top:0});
  if(route==='home'){const g=document.getElementById('homeGrid');g.innerHTML=homeCards('');document.getElementById('q').addEventListener('input',e=>g.innerHTML=homeCards(e.target.value))}
  if(route==='alat')bindAlat();
  if(route==='atlas'||route==='belajar'||route==='home')atlasBind();
  document.querySelectorAll('aside.toc a[data-sec]').forEach(l=>l.addEventListener('click',e=>{e.preventDefault();const s=document.getElementById(l.dataset.sec);if(s)s.scrollIntoView({behavior:'smooth'})}));
  const hh=document.querySelector('article h1,.atl h1');document.title=(route==='home'?'':(hh?hh.textContent.trim():route)+' · ')+'SamawatLab — Astronomi & Ilmu Falak';
}
addEventListener('hashchange',render);
document.getElementById('burger').addEventListener('click',()=>document.getElementById('menu').classList.toggle('open'));
render();
